<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Code Editor с таймером</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-microchip"></i>
                <h1>Arduino Code Editor с таймером</h1>
            </div>
            
            <div class="timer-section">
                <div class="timer-container">
                    <div class="timer" id="timerDisplay">00:00:00</div>
                    <div class="timer-controls">
                        <button class="timer-btn reset" id="resetTimerBtn" title="Сбросить таймер">
                            <i class="fas fa-redo"></i>
                            <span>Сброс</span>
                        </button>
                        <button class="timer-btn stop" id="stopTimerBtn" title="Остановить таймер и сравнить код">
                            <i class="fas fa-pause"></i>
                            <span>Стоп и сравнить</span>
                        </button>
                    </div>
                </div>
                <div class="status" id="timerStatus">Таймер остановлен. Начните печатать для запуска</div>
            </div>
        </div>
    </header>
    
    <main class="main-container">
        <div class="editor-container">
            <div class="card">
                <h2><i class="fas fa-code"></i> Ваш код Arduino</h2>
                <div class="code-wrapper">
                    <textarea id="codeEditor">void setup() {
  // Инициализация кода выполняется один раз при запуске
  
}

void loop() {
  // Основной цикл выполняется постоянно
 
}</textarea>
                </div>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer" style="display: none;">
            <div class="card">
                <h2><i class="fas fa-chart-bar"></i> Результаты сравнения</h2>
                <div class="comparison-results" id="comparisonResults">
                    <!-- Результаты будут добавлены здесь -->
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <p>Arduino Code Editor с таймером &copy; 2023</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
